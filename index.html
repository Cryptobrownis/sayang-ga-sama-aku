<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spesial Buat Kamu ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Sacramento&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
      position: relative;
    }
    .photo {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ff4b2b;
      margin-bottom: 15px;
    }
    h1 { font-family: 'Sacramento', cursive; font-size: 2.5rem; color: #ff2a5f; margin-bottom: 10px; }
    p { color: #555; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; }
    .btn-container { display: flex; justify-content: center; gap: 15px; position: relative; min-height: 50px; }
    button {
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-yes { background: #ff4b2b; color: white; }
    .btn-no { background: #ccc; color: #333; position: absolute; }
    #popup {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      z-index: 100;
      width: 80%;
      max-width: 350px;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Mengganti foto: ganti URL di src="" di bawah -->
    <img class="photo" id="foto" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400" alt="Foto Pacar">
    <h1 id="judul">Hai Cantik! ❤️</h1>
    <p id="pesan">Cuma mau ingetin kalau kamu itu selalu buat aku happy dan kangen tiap hari. Sayang banget sama kamu!</p>
    <p><strong>Kamu sayang aku juga nggak?</strong></p>
    
    <div class="btn-container">
      <button class="btn-yes" onclick="bukaPopup()">B aja! 🥺</button>
      <button class="btn-no" id="btnNo" onmouseover="kabur()" onclick="kabur()">Sayanggg Bangett!! ❤️</button>
    </div>
  </div>

  <!-- Pop up ketika tombol 'Sayang Banget' diklik -->
  <div id="popup">
    <h2>Sediihhhh! 🥺</h2>
    <p style="margin-top: 10px;">Cukup Tauu Akuu! 🥺✨</p>
    <button class="btn-yes" style="margin-top: 15px;" onclick="tutupPopup()">Tutup ❤️</button>
  </div>

  <script>
    // FUNGSI TOMBOL NGGAK BISA DIKLIK (KABUR)
    function kabur() {
      const btnNo = document.getElementById('btnNo');
      const x = Math.random() * (window.innerWidth - 110);
      const y = Math.random() * (window.innerHeight - 110);
      btnNo.style.position = 'fixed';
      btnNo.style.left = x + 'px';
      btnNo.style.top = y + 'px';
    }

    function bukaPopup() {
      document.getElementById('popup').style.display = 'block';
    }

    function tutupPopup() {
      document.getElementById('popup').style.display = 'none';
    }
  </script>
</body>
</html>
